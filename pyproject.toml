[tool.poetry]
name = "talkdb"
version = "0.1.0"
description = "Natural language to SQL using RAG with conversation memory, caching, and visualization"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "talkdb"}]

[tool.poetry.dependencies]
python = "^3.11"
openai = "^1.30.0"
google-generativeai = "^0.5.0"
chromadb = "^0.5.0"
faiss-cpu = "^1.8.0"
qdrant-client = "^1.9.0"
sentence-transformers = "^3.0.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
sqlparse = "^0.5.0"
psycopg2-binary = "^2.9.9"
plotly = "^5.22.0"
streamlit = "^1.35.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
